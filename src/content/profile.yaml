bio:
  es:
    - Soy estudiante de Ingeniería en Software en la Universidad Técnica de Ambato y desarrollador backend en Firma Segura, donde trabajo con Java y Spring Boot en microservicios. También construyo interfaces con React y TypeScript cuando el producto lo necesita.
    - Busco soluciones que combinen código limpio, arquitectura sólida y una buena experiencia de usuario. Fuera del código disfruto los videojuegos, la ciencia ficción, la naturaleza y la música para concentrarme.
  en:
    - I am a Software Engineering student at Universidad Técnica de Ambato and a backend developer at Firma Segura, where I work with Java and Spring Boot on microservices. I also build interfaces with React and TypeScript when the product needs it.
    - I look for solutions that combine clean code, solid architecture and a good user experience. Outside of code I enjoy video games, science fiction, nature and music to focus.

title:
  es: Walk Seguros
  en: Walk Seguros
summary:
  es: Sistema para que una aseguradora gestione pólizas, clientes, pagos y reembolsos en un solo lugar, con paneles separados para administrador, agente y cliente.
  en: System for an insurance company to manage policies, customers, payments and refunds in one place, with separate dashboards for admins, agents and customers.
description:
  es: Fui el principal contribuidor del frontend en un equipo de cinco. Construí con React los paneles por rol, los formularios de clientes y beneficiarios, la revisión de contratos en PDF antes de la firma, las tablas de pagos con estadísticas y las rutas protegidas con JWT, con pruebas unitarias de los componentes.
  en: I was the main frontend contributor in a team of five. I built the role-based dashboards in React, the customer and beneficiary forms, the PDF contract review before signing, the payment tables with statistics and the JWT protected routes, with unit tests for the components.

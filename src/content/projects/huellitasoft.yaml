title:
  es: HuellitaSoft
  en: HuellitaSoft
summary:
  es: Sistema para clínicas veterinarias con varias sucursales. Centraliza veterinarios, mascotas, historias clínicas y citas, y da a los dueños una app para agendar y seguir la salud de sus mascotas.
  en: System for veterinary clinics with several branches. It centralizes vets, pets, medical records and appointments, and gives owners an app to book visits and follow their pets' health.
description:
  es: En un equipo de cinco, trabajé en las tres capas. Participé en la API con Spring Boot, en el panel web para administradores y veterinarios con la gestión y la historia clínica, y en la app móvil donde los dueños agendan citas y encuentran veterinarias cercanas en un mapa.
  en: In a team of five, I worked across all three layers. I contributed to the Spring Boot API, the web dashboard for admins and vets with management and medical records, and the mobile app where owners book appointments and find nearby clinics on a map.

title:
  es: ChallengeHub
  en: ChallengeHub
summary:
  es: Plataforma web y móvil para mantener la motivación con retos. Los creadores publican desafíos y los usuarios los buscan por categoría, se suscriben y siguen su progreso.
  en: Web and mobile platform to stay motivated through challenges. Creators publish challenges and users search them by category, subscribe and track their progress.
description:
  es: En un equipo de cuatro, desarrollé pantallas de la web y de la app móvil con React y React Native, como las suscripciones, los comentarios y las reacciones, además de endpoints en Spring Boot para buscar retos y creadores por categoría.
  en: In a team of four, I built screens for the web and the mobile app with React and React Native, such as subscriptions, comments and reactions, plus Spring Boot endpoints to search challenges and creators by category.

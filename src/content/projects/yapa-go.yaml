title:
  es: YapaSegura
  en: YapaSegura
summary:
  es: Marketplace contra el desperdicio de alimentos en Ecuador. Los comercios venden sus excedentes en packs a bajo precio y los clientes los encuentran en un mapa, los reservan y los retiran.
  en: Marketplace against food waste in Ecuador. Shops sell their surplus food in low-cost packs, and customers find them on a map, reserve them and pick them up.
description:
  es: Lo desarrollé de principio a fin con Next.js y Supabase. Incluye registro por rol para clientes y comercios, un mapa con Leaflet para ubicar packs cercanos, reservas cuyo retiro se valida con un código OTP y un panel del comercio con reportes que muestran cuánto costo recupera.
  en: I built it end to end with Next.js and Supabase. It includes role-based sign-up for customers and shops, a Leaflet map to find nearby packs, reservations whose pickup is validated with an OTP code and a shop dashboard with reports that show how much cost it recovers.

company: Empresa Actual S.A.
start: 2024-02
role:
  es: Desarrollador Backend
  en: Backend Developer
summary:
  es: Diseño y mantengo los servicios que procesan las solicitudes de los clientes de la plataforma.
  en: I design and maintain the services that process customer requests on the platform.
challenge:
  problem:
    es: Las consultas de reportes tardaban más de ocho segundos en horas pico.
    en: Report queries took more than eight seconds during peak hours.
  approach:
    es: Medí los planes de ejecución, añadí índices compuestos y moví los agregados a una vista materializada. El tiempo bajó a menos de un segundo.
    en: I measured the execution plans, added composite indexes and moved the aggregates to a materialized view. Response time dropped below one second.
technologies: [Java, Spring Boot, PostgreSQL, Docker]

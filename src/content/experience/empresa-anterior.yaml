company: Empresa Anterior Cía. Ltda.
start: 2022-06
end: 2024-01
role:
  es: Desarrollador Full Stack
  en: Full Stack Developer
summary:
  es: Desarrollé módulos internos de facturación e inventario para equipos de operaciones.
  en: I built internal billing and inventory modules for operations teams.
challenge:
  problem:
    es: Dos sistemas guardaban el mismo inventario y se desincronizaban a diario.
    en: Two systems stored the same inventory and drifted out of sync every day.
  approach:
    es: Definí una única fuente de verdad y publiqué los cambios como eventos, con reintentos e idempotencia. Las diferencias manuales desaparecieron.
    en: I defined a single source of truth and published changes as events, with retries and idempotency. Manual reconciliation disappeared.
technologies: [Node.js, TypeScript, MongoDB, Kafka]
